name: 🚀 CD

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag for the release (semver, e.g. v1.0.0)
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: Publish skills release
    uses: $/.github/workflows/publish-skills.yaml
    permissions:
      contents: write # The callee reserves the tag and publishes the release.
    with:
      tag: ${{ inputs.tag }}
