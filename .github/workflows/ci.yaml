name: 🧪 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # On main each run is that commit's verification record, so it gets a run-unique
  # group and nothing there queues behind or evicts anything else. Disabling
  # cancellation alone would not be enough: a concurrency group holds one running
  # plus one pending run, and a third push cancels the pending one, so a second
  # push's checks would still be lost. A cancelled check is not a failed check, so
  # main would report green over verification that never completed.
  #
  # Pull requests keep the ref-keyed group, so superseded runs there still cancel.
  group: "${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  validate-retired-links:
    name: Validate retired repository links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation
        id: links
        uses: devantler-tech/.github/actions/validate-retired-repo-links@bd0035dd8f41fcf1459b878882b8897443f8dc59 # v4.9.4
        with:
          enabled: "true"
      - name: Require a complete scan
        env:
          VALIDATED: ${{ steps.links.outputs.validated }}
        run: test "$VALIDATED" = true
      - name: Prepare an isolated retired-link fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture=$(mktemp -d "$RUNNER_TEMP/retired-link-fixture.XXXXXX")
          git archive HEAD | tar -x -C "$fixture"
          printf '\n[Retired-link fixture](https://github.com/devantler-tech/reusable-workflows)\n' >> "$fixture/README.md"
          echo "directory=$fixture" >> "$GITHUB_OUTPUT"
      - name: Reject the seeded retired link
        id: negative
        continue-on-error: true
        uses: devantler-tech/.github/actions/validate-retired-repo-links@bd0035dd8f41fcf1459b878882b8897443f8dc59 # v4.9.4
        with:
          enabled: "true"
          working-directory: ${{ steps.fixture.outputs.directory }}
      - name: Reject missing consumer configuration
        id: missing-config
        continue-on-error: true
        uses: devantler-tech/.github/actions/validate-retired-repo-links@bd0035dd8f41fcf1459b878882b8897443f8dc59 # v4.9.4
        with:
          enabled: "true"
          config-file: .github/missing-retired-repo-links.json
      - name: Require both negative controls to fail without success output
        if: always()
        env:
          LINK_OUTCOME: ${{ steps.negative.outcome }}
          LINK_VALIDATED: ${{ steps.negative.outputs.validated }}
          CONFIG_OUTCOME: ${{ steps.missing-config.outcome }}
          CONFIG_VALIDATED: ${{ steps.missing-config.outputs.validated }}
        run: |
          test "$LINK_OUTCOME" = failure
          test -z "$LINK_VALIDATED"
          test "$CONFIG_OUTCOME" = failure
          test -z "$CONFIG_VALIDATED"
      - name: Checkout the exact validator source for diagnostic verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devantler-tech/.github
          ref: bd0035dd8f41fcf1459b878882b8897443f8dc59 # v4.9.4
          path: .catalogue-fixture
          sparse-checkout: actions/validate-retired-repo-links
          persist-credentials: false
      - name: Verify consumer wiring and exact rejection diagnostics
        shell: bash
        env:
          GOWORK: "off"
          GOFLAGS: ""
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go -C .catalogue-fixture/actions/validate-retired-repo-links build -mod=readonly -trimpath -o "$RUNNER_TEMP/retired-link-validator" .
          bash scripts/retired-repo-links.test.sh "$RUNNER_TEMP/retired-link-validator"

  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 🔧 Ensure gh >= 2.90.0
        env:
          GH_MIN_VERSION: 2.90.0
        run: |
          if gh skill --help >/dev/null 2>&1; then
            echo "Installed gh ($(gh --version | awk '/gh version/{print $3}')) already supports 'gh skill'."
            exit 0
          fi
          tmp=$(mktemp -d)
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_MIN_VERSION}/gh_${GH_MIN_VERSION}_linux_amd64.tar.gz" \
            | tar -xzC "$tmp"
          sudo install "$tmp/gh_${GH_MIN_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      - name: ✅ Validate skills (dry run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! find . -mindepth 2 -maxdepth 2 -name SKILL.md -print -quit | grep -q .; then
            echo "No skills in this repo yet — skipping 'gh skill publish --dry-run'."
            exit 0
          fi
          gh skill publish --dry-run

  discover-skills:
    name: Discover skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 📂 List skill directories
        id: list
        run: |
          skills=$(find . -mindepth 2 -maxdepth 2 -name SKILL.md -printf '%h\n' \
            | sed 's|^\./||' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$skills"; then
            echo "::error::Skill discovery produced invalid output."
            echo "Raw output: $skills"
            exit 1
          fi
          echo "skills=$skills" >> "$GITHUB_OUTPUT"
          echo "Discovered: $skills"

  validate-spec:
    name: Validate spec (${{ matrix.skill }})
    needs: discover-skills
    if: needs.discover-skills.outputs.skills != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover-skills.outputs.skills) }}
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 🐍 Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: 📦 Install skills-ref
        env:
          # Pin to a specific commit of agentskills/agentskills for reproducible installs.
          # https://github.com/agentskills/agentskills/tree/main/skills-ref
          AGENTSKILLS_REF: 8d8fcbc69e0c42e05922c2ffc287a3bbdef7b0a3
        run: |
          python -m pip install --disable-pip-version-check \
            "skills-ref @ git+https://github.com/agentskills/agentskills.git@${AGENTSKILLS_REF}#subdirectory=skills-ref"

      - name: ✅ Validate ${{ matrix.skill }} against agentskills.io spec
        env:
          SKILL: ${{ matrix.skill }}
        run: skills-ref validate "$SKILL"

  lint-scripts:
    name: Lint scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 🐚 ShellCheck scripts
        run: shellcheck scripts/*.sh product-engineering/scripts/*.sh agent-improvement/scripts/*.sh

      - name: 🧪 Verify the documentation guard remains required
        run: bash scripts/retired-repo-links.test.sh

      - name: 🧪 Verify exact shell census repository and commit identities
        run: bash product-engineering/scripts/inspect-shell-identity.test.sh

      - name: 🧪 Verify unique committed census paths
        run: bash product-engineering/scripts/inspect-shell-ambiguity.test.sh

      - name: 🧪 Verify canonical committed tree components
        run: bash product-engineering/scripts/inspect-shell-tree-integrity.test.sh

      - name: 🔗 Smoke-test the README index parser
        # Proves the load-bearing lockstep between the curated README index and
        # every consumer install path: a non-empty parse, the parsed count equal
        # to the number of Skills-table rows, every in-house skill present in the
        # index, and every in-house index entry resolving to an on-disk skill dir.
        # The same script is documented in AGENTS.md for local runs, so the gate
        # stays a single source of truth (no inline/doc drift).
        run: ./scripts/check-readme-index.sh

      - name: 🧪 Self-test the README index guard
        # Verifies check-readme-index.sh PASSES a consistent fixture and FAILS
        # each drift scenario it exists to catch (zero-parse, count vs rows,
        # in-house skill missing, unresolved entry, and every cross-column
        # desync), so a refactor that silently weakens a check is caught here —
        # not by a broken `gh skill install` reaching consumers. Self-contained
        # (copies the real scripts into throwaway fixtures): no gh or network.
        run: ./scripts/check-readme-index.test.sh

      - name: 🧪 Verify Agent Improver hypothesis eligibility
        # Rate-based hypotheses must not receive a success/failure verdict
        # before both their time and observation-volume floors are met.
        run: bash ./scripts/agent-improvement-contract.test.sh

      - name: 🧪 Verify prioritization and flow measurements
        run: bash ./scripts/agent-improvement-flow.test.sh

      - name: 🧪 Verify engineering evidence decisions
        run: bash ./scripts/product-engineering-evidence.test.sh

      - name: 🧪 Verify raw evidence input boundaries
        run: bash ./scripts/evidence-json-boundaries.test.sh

      - name: 🧪 Verify retained raw evidence bytes and installed paths
        run: bash ./scripts/evidence-input-bytes.test.sh

      - name: 🧪 Verify visible evidence references
        run: bash ./scripts/evidence-reference-visibility.test.sh

      - name: 🧪 Verify self-improvement evidence scenarios
        run: bash ./scripts/self-improvement-evidence.test.sh

      - name: 🧪 Verify promotion readiness contracts
        # Each independently installable engineering skill must carry the full
        # readiness gate, and the portfolio loop must revalidate it at both
        # promotion and merge rather than reuse an earlier observation.
        run: ./scripts/promotion-readiness-contract.test.sh

      - name: 🧪 Verify portfolio survey dispatch gate
        # A complete fresh higher-rung preemption result makes broad discovery
        # decision-irrelevant, while stale or incomplete evidence still surveys.
        run: ./scripts/portfolio-maintenance-survey-gate.test.sh

      - name: 🧪 Verify maintainer-PR driving contract
        # Whether a PR under the maintainer's own login may be driven is the Trust gate's
        # declared fact, defaulting to hands-off — never an absolute the skill imposes on
        # every deployment, and never a grant an undeclared deployment receives silently.
        run: ./scripts/portfolio-maintenance-driving-contract.test.sh

      - name: 🧪 Self-test the installer
        # Pins install.sh's own contracts the index guard doesn't assert: --list
        # (and -l) print sorted, de-duplicated `<repo> <skill>` parsed only from
        # `## Skills`; --list is gh-free (the documented offline path CI alone
        # can't prove — CI always has gh); and a missing/empty index fails loudly.
        # Self-contained (real install.sh into throwaway fixtures): no gh/network.
        run: ./scripts/install.test.sh

      - name: 🧪 Verify catalogue source pins
        run: bash ./scripts/install-source.test.sh

      - name: 🧪 Verify source identities and complete local discovery
        run: bash ./scripts/source-boundaries.test.sh

      - name: 🧪 Verify catalogue commands and exact paths
        run: bash ./scripts/catalogue-boundaries.test.sh

      - name: 🧪 Verify complete catalogues and native destinations
        run: bash ./scripts/catalogue-integrity.test.sh

      - name: 🧪 Self-test the upstream-skills guard
        # The real check-upstream-skills.sh resolves upstream targets over the network
        # (the standalone scheduled `🔗 Upstream skill targets` workflow), so it can't
        # gate PRs — but its parsing/control flow can: this pins that it scopes to
        # ## Skills, decomposes Upstream tree URLs (owner/repo/ref/path), fails closed
        # when the parser finds nothing, and discriminates hard drift (HTTP 404) from
        # transient warnings (any other error). Self-contained — runs the REAL guard
        # against throwaway fixtures with a deterministic offline `gh` stub: no gh/network.
        run: ./scripts/check-upstream-skills.test.sh

      - name: 🧪 Verify upstream observation failures
        run: bash ./scripts/check-upstream-observations.test.sh

      - name: 🧪 Self-test the release publish gate
        # publish-skills-release.sh decides whether `gh skill publish` runs at all. Both wrong
        # answers are expensive — skipping a publish that never happened ships nothing while
        # reporting success, and re-publishing an existing tag is the unrecoverable red release
        # run this script ends (#106) — and neither is observable in CI, which always has a real
        # gh and a real repository. Self-contained: drives the REAL script against a PATH-first
        # gh stub and asserts both the exit status and whether a publish actually happened.
        run: ./scripts/publish-skills-release.test.sh

      - name: 🧪 Verify release publisher argument boundaries
        run: bash ./scripts/publish-arguments.test.sh

      - name: 🧪 Verify human accountability brief checks and rendering
        run: bash ./scripts/product-engineering-accountability.test.sh

      - name: 🧪 Verify read-only tool inventories
        run: bash ./product-engineering/scripts/inspect-shell-helpers.test.sh

  ci-required-checks:
    name: CI - Required Checks
    if: always()
    needs: [validate, discover-skills, validate-spec, lint-scripts, validate-retired-links]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: ✅ Verify required jobs passed
        uses: devantler-tech/.github/actions/aggregate-job-checks@8927f40e06cf2446dfee4e3dfa10172758b72fb0 # v6.2.2
        with:
          job-results: >-
            ${{ needs.validate.result }}
            ${{ needs.discover-skills.result }}
            ${{ needs.validate-spec.result }}
            ${{ needs.lint-scripts.result }}
            ${{ needs.validate-retired-links.result }}
